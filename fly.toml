# Fly.io config. Run `fly launch --copy-config --no-deploy`, pick a unique app name, then:
#   fly volumes create manhunt_data --size 1 --region <your-region>
#   fly deploy
app = "manhunt-private"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/manhunt.db"
  TRUST_PROXY = "true"
  LOCATION_RETENTION_MINUTES = "60"
  GAME_RETENTION_HOURS = "24"

[mounts]
  source = "manhunt_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A single always-on machine: game timers live in this process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
